[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nvidia-nim-proxy"
version = "0.1.0"
description = "Local NVIDIA NIM compatibility proxy for OpenAI, Codex Responses, and Anthropic Messages clients."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Rahul Ghuge" }
]
license = { text = "MIT" }
keywords = ["nvidia", "nim", "proxy", "openai", "codex", "anthropic", "claude"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://developer.nvidia.com/nim"

[project.scripts]
nim-proxy = "nvidia_nim_proxy.cli:main"
nvidia-nim-proxy = "nvidia_nim_proxy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nvidia_nim_proxy = ["py.typed"]
